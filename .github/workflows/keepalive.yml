on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Stamp the heartbeat row
        run: |
          curl --fail-with-body -sS -X POST \
            'https://qdbadahhgytdscdbljov.supabase.co/rest/v1/rpc/keepalive' \
            -H 'apikey: sb_publishable_JEIF9Vc-Ij3BSkOnLtFh5A_pRT4WBK0' \
            -H 'Content-Type: application/json' \
            -d '{}'
